<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" fill="none">
  <rect width="1200" height="630" fill="#141310"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#2c2a26" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>

  <!-- Red accent line -->
  <rect x="80" y="180" width="60" height="4" rx="2" fill="#c8102e"/>

  <!-- Logo mark (simplified) -->
  <g transform="translate(80, 220) scale(0.5)">
    <path d="M 22 100 L 61 32.5 L 139 32.5" stroke="#fafafa" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 139 167.5 L 61 167.5 L 22 100" stroke="#fafafa" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 139 32.5 L 178 100 L 139 167.5" stroke="#c8102e" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 82 70 Q 72 70 72 80 L 72 92 Q 72 100 64 100 Q 72 100 72 108 L 72 120 Q 72 130 82 130" stroke="#fafafa" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 118 70 Q 128 70 128 80 L 128 92 Q 128 100 136 100 Q 128 100 128 108 L 128 120 Q 128 130 118 130" stroke="#fafafa" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="88" y1="93" x2="112" y2="93" stroke="#fafafa" stroke-width="7" stroke-linecap="round"/>
    <line x1="88" y1="107" x2="112" y2="107" stroke="#c8102e" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Title -->
  <text x="200" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#fafafa" letter-spacing="-2">Ovaso</text>

  <!-- Subtitle -->
  <text x="82" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#b0ada6" letter-spacing="-0.5">Free API to verify businesses registered in</text>
  <text x="82" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#c8102e" font-weight="600" letter-spacing="-0.5">Trinidad &amp; Tobago</text>

  <!-- Code snippet -->
  <rect x="82" y="420" width="500" height="44" rx="6" fill="#1e1c18" stroke="#2c2a26" stroke-width="1"/>
  <text x="100" y="448" font-family="ui-monospace, monospace" font-size="16" fill="#6b6760">$</text>
  <text x="120" y="448" font-family="ui-monospace, monospace" font-size="16" fill="#fafafa">curl</text>
  <text x="165" y="448" font-family="ui-monospace, monospace" font-size="16" fill="#c8102e">ovaso.onrender.com/check?name=massy</text>

  <!-- Tags -->
  <text x="82" y="530" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#6b6760" letter-spacing="1">NO API KEY  ·  OPEN SOURCE  ·  FREE</text>

  <!-- URL -->
  <text x="1118" y="580" font-family="ui-monospace, monospace" font-size="14" fill="#6b6760" text-anchor="end">ovaso.vercel.app</text>
</svg>
